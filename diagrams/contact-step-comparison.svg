<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="900" height="510" rx="20" fill="#f1f7f8"/><g font-family="DejaVu Sans, sans-serif" fill="#19334a"><text x="42" y="55" font-size="38" text-anchor="start" font-weight="700">What a late impact changes</text><text x="45" y="94" font-size="26" text-anchor="start">Same release and restitution in all three cases</text><text x="45" y="157" font-size="26" text-anchor="start" font-weight="700">Method</text><text x="436" y="157" font-size="26" text-anchor="middle" font-weight="700">Below floor</text><text x="708" y="157" font-size="26" text-anchor="middle" font-weight="700">Rebound apex</text><rect x="39" y="182" width="822" height="68" rx="12" fill="#dfefef"/><text x="60" y="226" font-size="27" text-anchor="start" font-weight="700">Exact event</text><text x="436" y="226" font-size="27" text-anchor="middle">0.0 mm</text><text x="708" y="226" font-size="27" text-anchor="middle">45.000 mm</text><rect x="39" y="263" width="822" height="68" rx="12" fill="#f9e9db"/><text x="60" y="307" font-size="27" text-anchor="start" font-weight="700">50 ms check</text><text x="436" y="307" font-size="27" text-anchor="middle">20.0 mm</text><text x="708" y="307" font-size="27" text-anchor="middle">50.000 mm</text><rect x="39" y="344" width="822" height="68" rx="12" fill="#e2eef4"/><text x="60" y="388" font-size="27" text-anchor="start" font-weight="700">2 ms check</text><text x="436" y="388" font-size="27" text-anchor="middle">0.5 mm</text><text x="708" y="388" font-size="27" text-anchor="middle">45.125 mm</text><text x="45" y="477" font-size="24" text-anchor="start">Depth is a numerical artifact, not material deformation.</text></g></svg>
